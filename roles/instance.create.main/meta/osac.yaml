resource_type: ComputeInstance
event: Create
phase: main
priority: 100
failure_policy: Fail

title: KubeVirt ComputeInstance
description: >
  Creates a KubeVirt VirtualMachine from a ComputeInstance CRD,
  including secrets, DataVolumes, and network attachments.

spec_defaults:
  cores: 2
  memory_gib: 2
  boot_disk:
    size_gib: 10
  image:
    source_type: registry
    source_ref: "quay.io/containerdisks/fedora:latest"
  run_strategy: "Always"

parameters:
  - name: exposed_ports
    title: Exposed Ports
    description: >
      Ports to expose on the VM for ingress traffic.
      The syntax is a comma-separated list of `<port>/<protocol>` pairs,
      where `<protocol>` is either `tcp` or `udp`.
      For example, `22/tcp,80/tcp` will expose tcp ports 22 and 80 on the VM.
    type: string
    required: false
    default: "22/tcp"
    validation:
      pattern: '^([0-9]+/(tcp|udp))(,[0-9]+/(tcp|udp))*$'

outputs:
  - name: instance_id
    type: string
    description: Created ComputeInstance UID
  - name: instance_state
    type: string
    description: "VM state (running, error)"
  - name: ip_address
    type: string
    description: Primary IP address
  - name: hostname
    type: string
    description: VM hostname
  - name: backend_ref
    type: string
    description: KubeVirt VirtualMachine name
